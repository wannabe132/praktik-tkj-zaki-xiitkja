services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./PemesananLapanganFutsal:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: futsal_user
      DB_PASS: futsal_pass123
      DB_NAME: db_pemesananlapanganfutsal
    volumes:
      - ./PemesananLapanganFutsal:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_pass123
      MARIADB_DATABASE: db_pemesananlapanganfutsal
      MARIADB_USER: futsal_user
      MARIADB_PASSWORD: futsal_pass123
    volumes:
      - db_data:/var/lib/mysql
      - ./db_pemesananlapanganfutsal.sql:/docker-entrypoint-initdb.d/db_pemesananlapanganfutsal.sql
    restart: unless-stopped

volumes:
  db_data:
